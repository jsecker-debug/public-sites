<!doctype html>
<html lang="en-GB">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark">
<title>Apps by Joshua Secker</title>
<style>
  :root { --bg: #f4f6f5; --surface: #ffffff; --ink: #17211f; --muted: #56655f; --rule: #d9e0dd; --accent: #2c6b5a; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #101615; --surface: #172020; --ink: #e5ecea; --muted: #9aaba5; --rule: #2a3533; --accent: #7cc4ae; }
  }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 400 17px/1.6 -apple-system, "Segoe UI", sans-serif; padding: 40px 20px 64px; }
  .wrap { max-width: 680px; margin: 0 auto; display: grid; gap: 24px; }
  h1 { font-size: 2rem; line-height: 1.15; margin: 0; }
  p { margin: 0; color: var(--muted); }
  ul { list-style: none; padding: 0; margin: 0; display: grid; gap: 12px; }
  li { background: var(--surface); border: 1px solid var(--rule); border-radius: 12px; padding: 16px 20px; display: grid; gap: 4px; }
  li strong { font-size: 1.1rem; }
  a { color: var(--accent); font-weight: 600; }
  .links { display: flex; flex-wrap: wrap; gap: 16px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Apps by Joshua Secker</h1>
  <p>Privacy policies and support for my apps.</p>
  <ul>
    <li>
      <strong>Haunts</strong>
      <span>Trip planner for iPhone</span>
      <span class="links"><a href="haunts/#privacy">Privacy Policy</a><a href="haunts/#support">Support</a></span>
    </li>
  </ul>
  <p>Contact: <a href="mailto:js.apps.support@gmail.com">js.apps.support@gmail.com</a></p>
</div>
</body>
</html>
